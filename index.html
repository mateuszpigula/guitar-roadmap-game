<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#f8f6f0"/>
    <script>
      // Apply the device preference before the app or its styles load.
      (()=>{let choice='system';try{choice=localStorage.getItem('guitar-quest-theme')||'system';}catch{}
        const theme=choice==='dark'||(choice!=='light'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches)?'dark':'light';
        document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;
        document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#191d1a':'#f8f6f0';
      })();
    </script>
    <meta name="description" content="Twoja droga od pierwszych dźwięków do samodzielnego grania. Lekcje, ćwiczenia i mapa nauki gitary."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Guitar Quest"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192"/>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180"/>
    <title>Guitar Quest — Twoja muzyczna podróż</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
